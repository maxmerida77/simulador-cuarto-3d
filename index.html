<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Cuarto 3D</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/examples/jsm/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Barra superior mínima: menú + combos + total -->
  <header class="topbar" id="app-topbar">
    <button id="btn-toggle-drawer-top" class="icon-btn" title="Mostrar / ocultar catálogo">☰</button>
    <div id="quick-combos-bar" class="combos-bar"></div>
    <div class="topbar-right">
      <div class="budget-pill" id="budget-pill" title="Total de lo seleccionado">
        <span id="budget-total-amount">$0</span>
      </div>
      <button id="btn-screenshot" class="icon-btn" title="Guardar foto del render">📷</button>
    </div>
  </header>

  <main class="main-layout" id="main-layout">
    <!-- Catálogo lateral (compacto: el detalle sale con ⓘ) -->
    <aside class="config-sidebar" id="config-sidebar">
      <div class="sidebar-scroll">
        <div id="zones-accordion-list"></div>

        <div class="zone-card" id="finishes-card">
          <button class="zone-header" id="finishes-toggle">
            <span class="z-icon">🎨</span>
            <span class="z-name">Acabados</span>
            <span class="z-choice">Pintura, piso, colchas</span>
            <span class="z-chev">▾</span>
          </button>
          <div class="zone-body collapsed" id="finishes-body">
            <div class="finish-group">
              <label>Luces LED</label>
              <div id="led-colors-row" class="pills-wrap"></div>
            </div>
            <div class="finish-group">
              <label>Pintura</label>
              <div id="wall-palettes-row" class="pills-wrap"></div>
            </div>
            <div class="finish-group">
              <label>Colchas</label>
              <div id="bedding-themes-row" class="pills-wrap"></div>
            </div>
            <div class="finish-group">
              <label>Piso</label>
              <div id="floor-types-row" class="pills-wrap"></div>
            </div>
          </div>
        </div>

        <label class="mini-toggle">
          <input id="switch-show-clutter" type="checkbox" />
          <span>🧹 Mostrar desorden actual</span>
        </label>
      </div>
    </aside>

    <!-- Lienzo 3D -->
    <section class="viewport-area">
      <div id="viewport-container"></div>

      <!-- Antes / Después: barra deslizable -->
      <div id="compare-overlay" class="compare-overlay hidden">
        <span class="cmp-label left">ANTES</span>
        <span class="cmp-label right">DESPUÉS</span>
        <div id="compare-handle" class="compare-handle"><span>⇆</span></div>
      </div>

      <!-- Escenas de luz (arriba izquierda) -->
      <div class="scene-bar" id="scene-bar"></div>

      <!-- Herramientas (arriba derecha) -->
      <div class="tool-bar">
        <button id="btn-undo" class="icon-btn" title="Deshacer (Ctrl+Z)" disabled>↶</button>
        <button id="btn-redo" class="icon-btn" title="Rehacer (Ctrl+Y)" disabled>↷</button>
        <span class="tool-sep"></span>
        <button id="btn-compare" class="icon-btn" title="Antes / Después">◐</button>
        <button id="btn-fullscreen" class="icon-btn" title="Pantalla completa">⛶</button>
      </div>

      <!-- Aviso breve -->
      <div id="toast" class="toast hidden"></div>

      <!-- Tooltip al pasar el mouse -->
      <div id="hover-3d-tooltip" class="hover-3d-tooltip hidden"></div>

      <!-- Pin sobre el objeto seleccionado -->
      <div id="floating-3d-pin" class="floating-3d-pin hidden">
        <div class="pin-bubble">
          <span class="pin-name" id="pin-3d-name">Artículo</span>
          <span class="pin-price" id="pin-3d-price">$0</span>
        </div>
        <div class="pin-stem"></div>
        <div class="pin-dot"></div>
      </div>

      <!-- Ficha del artículo (al dar clic en el 3D) -->
      <aside id="room-item-inspector" class="room-item-inspector hidden">
        <div class="insp-header">
          <span class="insp-badge" id="insp-badge">Categoría</span>
          <button id="btn-close-inspector" class="insp-close-btn" title="Cerrar">✕</button>
        </div>
        <div class="insp-title-row">
          <h3 class="insp-title" id="insp-title">Artículo</h3>
          <span class="insp-price" id="insp-price">$0</span>
        </div>

        <div id="insp-subgadgets-wrap" class="insp-subgadgets-wrap hidden">
          <div id="insp-subgadgets-list" class="insp-subgadgets-list"></div>
        </div>

        <div id="insp-links-wrap" class="insp-links-wrap"></div>

        <details class="insp-more">
          <summary>Más info</summary>
          <div class="insp-dims" id="insp-dims">📐</div>
          <p class="insp-desc" id="insp-desc"></p>
        </details>

        <div class="insp-actions-bar">
          <button id="act-zoom-item" class="insp-act-btn primary" title="Acercar cámara">🎯 Ver de cerca</button>
          <button id="act-rot-l" class="insp-act-btn" title="Girar -45°">↺</button>
          <button id="act-rot-r" class="insp-act-btn" title="Girar +45°">↻</button>
          <button id="act-elev-up" class="insp-act-btn" title="Subir">↑</button>
          <button id="act-elev-dn" class="insp-act-btn" title="Bajar">↓</button>
          <button id="act-del" class="insp-act-btn danger" title="Quitar">🗑️</button>
        </div>
      </aside>

      <!-- Cámaras (abajo): solo íconos, el nombre aparece al pasar el mouse -->
      <nav class="bottom-cam-bar">
        <button class="cam-pill active" data-cam-preset="orbit_3d" title="Cuarto completo">🧊<span class="cam-label">Cuarto</span></button>
        <button class="cam-pill" data-cam-preset="desk_front" title="Monitor y teclado">🖥️<span class="cam-label">Escritorio</span></button>
        <button class="cam-pill" data-cam-preset="desk_corner" title="Laptop en la esquina">💻<span class="cam-label">Laptop</span></button>
        <button class="cam-pill" data-cam-preset="desk_lab" title="Laboratorio">🛠️<span class="cam-label">Lab</span></button>
        <button class="cam-pill" data-cam-preset="desk_pegboard" title="Panel y repisas">🧰<span class="cam-label">Panel</span></button>
        <button class="cam-pill" data-cam-preset="zoom_soccer" title="Bufandas en la 2da litera">⚽<span class="cam-label">Litera</span></button>
        <button class="cam-pill" data-cam-preset="zoom_underbed" title="Bajo la cama">🛏️<span class="cam-label">Bajo cama</span></button>
        <span class="cam-divider"></span>
        <button class="cam-pill" data-cam-preset="top_2d" title="Planta 2D">📐<span class="cam-label">Planta</span></button>
        <button class="cam-pill" data-cam-preset="walk" title="Caminar con WASD">🎮<span class="cam-label">Caminar</span></button>
      </nav>
    </section>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
